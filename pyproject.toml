[project]
name = "aipf-sample-snapshot-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio==1.83.0",
    "mypy-protobuf==5.1.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.83.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.ruff]
line-length = 110
exclude = ["*_pb2.py", "*_pb2_grpc.py", "*.pyi"]

[tool.ruff.lint]
extend-select = ["I"]
